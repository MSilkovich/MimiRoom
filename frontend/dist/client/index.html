<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f1eb"><meta name="description" content="МиМиРум — рабочее пространство заботы о питомцах"><title>МиМиРум · Пространство заботы</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/client.css"><link rel="stylesheet" href="/support.css"></head><body><div id="app"></div><div id="overlay"></div><div id="toast" role="status" aria-live="polite"></div><script>function mimiroomBootError(error){const root=document.getElementById('app');if(root&&!root.children.length){const box=document.createElement('section');box.style.cssText='max-width:700px;margin:70px auto;padding:30px;font-family:Arial;line-height:1.7';const h=document.createElement('h1');h.textContent='Не удалось запустить МиМиРум';const p=document.createElement('p');p.textContent='Обновите страницу. Если ошибка повторится, передайте этот текст разработчику:';const pre=document.createElement('pre');pre.style.whiteSpace='pre-wrap';pre.textContent=error?.message||String(error);box.append(h,p,pre);root.append(box)}}window.addEventListener('error',e=>mimiroomBootError(e.error||e.message));window.addEventListener('unhandledrejection',e=>mimiroomBootError(e.reason));</script><script type="module" src="/app.js"></script></body></html>
