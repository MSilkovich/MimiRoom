services:
  core:
    container_name: core-service
    build: 
      context: ../core
      args:
        CORE_PORT: ${CORE_PORT}
    env_file:
      - ../core/.env
    ports:
      - "${CORE_PORT}:${CORE_PORT}"
    restart: unless-stopped
    networks:
      - network-bridge
    volumes:
      - ./logs:/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${CORE_PORT}/healthcheck" ]
      interval: 2s
      timeout: 10s
      retries: 5
