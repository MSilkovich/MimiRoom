services:
  ai-engine:
    container_name: ai-engine-service
    build:
      context: ../engine
      args:
        AI_ENGINE_PORT: ${AI_ENGINE_PORT}
    environment:
      AI_ENGINE_PORT: ${AI_ENGINE_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}

      PROJECT_NAME: ${PROJECT_NAME}
      VERSION: ${VERSION}

      LOG_LEVEL: ${LOG_LEVEL}
      LOG_CONSOLE: ${LOG_CONSOLE}
      LOG_FILE: ${LOG_FILE}
      LOG_FILE_PATH: ${LOG_FILE_PATH}
    ports:
      - "${AI_ENGINE_PORT}:${AI_ENGINE_PORT}"
    restart: unless-stopped
    networks:
      - network-bridge
    volumes:
      - ./logs:/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${AI_ENGINE_PORT}/healthcheck" ]
      interval: 2s
      timeout: 10s
      retries: 5