name: mimiroom-server

services:
  postgres:
    extends:
      file: docker-compose.postgres.yaml
      service: postgres

  redis:
    extends:
      file: docker-compose.redis.yaml
      service: redis

  core:
    extends:
      file: docker-compose.core.yaml
      service: core

  tg:
    extends:
      file: docker-compose.tg.yaml
      service: tg

  ai-engine:
    extends:
      file: docker-compose.ai.yaml
      service: ai-engine

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    restart: unless-stopped

  xray:
    image: lovechen/xray:latest
    container_name: xray-proxy
    restart: unless-stopped
    volumes:
      - ./vpn-config.json:/etc/xray/config.json:ro
    networks:
      - network-bridge

volumes:
  postgres-data:
  redis-data:
  redisinsight-data:

networks:
  network-bridge:
    driver: bridge
